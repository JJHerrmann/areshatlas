<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1060" width="1200" height="1060" font-family="Familjen Grotesk, system-ui, -apple-system, Segoe UI, sans-serif">
<rect width="1200" height="1060" fill="#0d171c"/>
<text x="40" y="56" font-size="32" fill="#E8E1D0" font-weight="700" text-anchor="start">The elf hand: the root script</text>
<text x="40" y="84" font-size="15" fill="#9fb3ba" font-weight="400" text-anchor="start">Vertical, spine top to bottom, columns left to right. Vowels are full letters, set on either side of the spine.</text>
<rect x="40" y="110" width="1120" height="300" rx="14" fill="#1A2B33" stroke="#26373F"/>
<text x="70" y="152" font-size="22" fill="#E8E1D0" font-weight="700" text-anchor="start">Vowels</text>
<text x="70" y="176" font-size="14.5" fill="#9fb3ba" font-weight="400" text-anchor="start">Left of the spine is the deep class. Right of the spine is the forward class. One stroke, two strokes, or a ring.</text>
<rect x="70" y="190" width="194" height="200" rx="10" fill="#142229" stroke="#26373F"/>
<g transform="translate(170,225) scale(2) "><path d="M0 -6 V38" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(0,0)"><path d="M0 4 L-16 14" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<text x="86" y="222" font-size="18" fill="#E8E1D0" font-weight="600" text-anchor="start">a</text>
<text x="86" y="378" font-size="13" fill="#9fb3ba" font-weight="400" text-anchor="start">left, deep</text>
<rect x="284" y="190" width="194" height="200" rx="10" fill="#142229" stroke="#26373F"/>
<g transform="translate(384,225) scale(2) "><path d="M0 -6 V38" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(0,0)"><path d="M0 4 C-20 0 -22 24 0 20" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<text x="300" y="222" font-size="18" fill="#E8E1D0" font-weight="600" text-anchor="start">o</text>
<text x="300" y="378" font-size="13" fill="#9fb3ba" font-weight="400" text-anchor="start">left, deep</text>
<rect x="498" y="190" width="194" height="200" rx="10" fill="#142229" stroke="#26373F"/>
<g transform="translate(598,225) scale(2) "><path d="M0 -6 V38" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(0,0)"><path d="M0 2 L-14 8 M0 12 L-14 18" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<text x="514" y="222" font-size="18" fill="#E8E1D0" font-weight="600" text-anchor="start">u</text>
<text x="514" y="378" font-size="13" fill="#9fb3ba" font-weight="400" text-anchor="start">left, deep</text>
<rect x="712" y="190" width="194" height="200" rx="10" fill="#142229" stroke="#26373F"/>
<g transform="translate(812,225) scale(2) "><path d="M0 -6 V38" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(0,0)"><path d="M0 4 L16 14" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<text x="728" y="222" font-size="18" fill="#E8E1D0" font-weight="600" text-anchor="start">e</text>
<text x="728" y="378" font-size="13" fill="#9fb3ba" font-weight="400" text-anchor="start">right, forward</text>
<rect x="926" y="190" width="194" height="200" rx="10" fill="#142229" stroke="#26373F"/>
<g transform="translate(1026,225) scale(2) "><path d="M0 -6 V38" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(0,0)"><path d="M0 2 L14 8 M0 12 L14 18" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<text x="942" y="222" font-size="18" fill="#E8E1D0" font-weight="600" text-anchor="start">i</text>
<text x="942" y="378" font-size="13" fill="#9fb3ba" font-weight="400" text-anchor="start">right, forward</text>
<rect x="40" y="430" width="1120" height="240" rx="14" fill="#1A2B33" stroke="#26373F"/>
<text x="70" y="472" font-size="22" fill="#E8E1D0" font-weight="700" text-anchor="start">Consonants (sketch)</text>
<text x="70" y="496" font-size="14.5" fill="#9fb3ba" font-weight="400" text-anchor="start">Five are drawn so far: l, n, r, s, t. Each hangs from the spine on the side that suits its stroke.</text>
<rect x="70" y="510" width="194" height="140" rx="10" fill="#142229" stroke="#26373F"/>
<g transform="translate(170,535) scale(1.6) "><path d="M0 -6 V38" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(0,0)"><path d="M0 2 C18 6 24 20 18 34" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<text x="86" y="538" font-size="18" fill="#E8E1D0" font-weight="600" text-anchor="start">l</text>
<rect x="284" y="510" width="194" height="140" rx="10" fill="#142229" stroke="#26373F"/>
<g transform="translate(384,535) scale(1.6) "><path d="M0 -6 V38" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(0,0)"><path d="M0 8 L-6 14 L0 20 M-9 14 h0" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<text x="300" y="538" font-size="18" fill="#E8E1D0" font-weight="600" text-anchor="start">n</text>
<rect x="498" y="510" width="194" height="140" rx="10" fill="#142229" stroke="#26373F"/>
<g transform="translate(598,535) scale(1.6) "><path d="M0 -6 V38" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(0,0)"><path d="M0 2 C-18 6 -24 22 -16 36" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<text x="514" y="538" font-size="18" fill="#E8E1D0" font-weight="600" text-anchor="start">r</text>
<rect x="712" y="510" width="194" height="140" rx="10" fill="#142229" stroke="#26373F"/>
<g transform="translate(812,535) scale(1.6) "><path d="M0 -6 V38" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(0,0)"><path d="M-14 10 C0 -2 0 28 14 20" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<text x="728" y="538" font-size="18" fill="#E8E1D0" font-weight="600" text-anchor="start">s</text>
<rect x="926" y="510" width="194" height="140" rx="10" fill="#142229" stroke="#26373F"/>
<g transform="translate(1026,535) scale(1.6) "><path d="M0 -6 V38" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(0,0)"><path d="M-14 14 H14" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<text x="942" y="538" font-size="18" fill="#E8E1D0" font-weight="600" text-anchor="start">t</text>
<rect x="40" y="690" width="1120" height="350" rx="14" fill="#1A2B33" stroke="#26373F"/>
<text x="70" y="732" font-size="22" fill="#E8E1D0" font-weight="700" text-anchor="start">Turn it 90 degrees clockwise</text>
<text x="70" y="756" font-size="14.5" fill="#9fb3ba" font-weight="400" text-anchor="start">The same word, silenar, as the elf column and then lying down. Top-to-bottom becomes right-to-left.</text>
<text x="70" y="788" font-size="14.5" fill="#9fb3ba" font-weight="400" text-anchor="start">Left ticks land above and right ticks below, which is where the refugee helper marks sit.</text>
<g transform="translate(330,818) scale(0.75) "><path d="M0 -6 V266" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(0,0)"><path d="M-14 10 C0 -2 0 28 14 20" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(0,38)"><path d="M0 2 L14 8 M0 12 L14 18" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(0,76)"><path d="M0 2 C18 6 24 20 18 34" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(0,114)"><path d="M0 4 L16 14" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(0,152)"><path d="M0 8 L-6 14 L0 20 M-9 14 h0" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(0,190)"><path d="M0 4 L-16 14" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(0,228)"><path d="M0 2 C-18 6 -24 22 -16 36" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<text x="330" y="1030" font-size="13" fill="#9fb3ba" font-weight="400" text-anchor="middle">elf column</text>
<path d="M450 920 C500 890 540 890 590 920" fill="none" stroke="#52C4D6" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="520" y="884" font-size="13" fill="#52C4D6" font-weight="500" text-anchor="middle">rotate 90 degrees clockwise</text>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#52C4D6" stroke-width="1.5"/></marker></defs>
<g transform="translate(1000,910) scale(0.75) rotate(90)"><path d="M0 -6 V266" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(0,0)"><path d="M-14 10 C0 -2 0 28 14 20" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(0,38)"><path d="M0 2 L14 8 M0 12 L14 18" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(0,76)"><path d="M0 2 C18 6 24 20 18 34" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(0,114)"><path d="M0 4 L16 14" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(0,152)"><path d="M0 8 L-6 14 L0 20 M-9 14 h0" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(0,190)"><path d="M0 4 L-16 14" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(0,228)"><path d="M0 2 C-18 6 -24 22 -16 36" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<text x="880" y="1030" font-size="13" fill="#9fb3ba" font-weight="400" text-anchor="middle">the same word as a dwarf baseline</text>
</svg>