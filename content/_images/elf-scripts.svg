<g transform="translate(-290,0)"><path d="M0 0 H-22 M-6 0 C-6 -16 -10 -34 -18 -42" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<text x="1110" y="362" font-size="13.5" fill="#9fb3ba" font-weight="400" text-anchor="end" font-family="system-ui,Segoe UI,sans-serif">silenar torial   (the star sings, invented)</text>
<rect x="40" y="400" width="1120" height="340" rx="14" fill="#1A2B33" stroke="#26373F"/>
<text x="70" y="444" font-size="22" fill="#E8E1D0" font-weight="700" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">2. Thaana-lean</text>
<text x="70" y="468" font-size="14.5" fill="#9fb3ba" font-weight="400" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">Separate consonants, short hooked strokes. Vowels are marks above and below.</text>
<text x="70" y="504" font-size="13.5" fill="#9fb3ba" font-weight="400" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">- Reads right to left. Marks: slash a, low slash e,</text>
<text x="70" y="524" font-size="13.5" fill="#9fb3ba" font-weight="400" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">  double slash i, ring o.</text>
<text x="70" y="550" font-size="13.5" fill="#9fb3ba" font-weight="400" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">- Same device as the dwarf refugee helper marks, so</text>
<text x="70" y="570" font-size="13.5" fill="#9fb3ba" font-weight="400" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">  the two cultures look related.</text>
<text x="70" y="596" font-size="13.5" fill="#9fb3ba" font-weight="400" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">- Least dense of the three. Easy to carve, easy to</text>
<text x="70" y="616" font-size="13.5" fill="#9fb3ba" font-weight="400" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">  fake a font for.</text>
<g transform="translate(1100,600) scale(1.45)">
