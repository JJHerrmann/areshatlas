<path d="M-16 -46 L-6 -42" fill="none" stroke="#cfe8d6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</g>
<text x="1110" y="722" font-size="13.5" fill="#9fb3ba" font-weight="400" text-anchor="end" font-family="system-ui,Segoe UI,sans-serif">silenar torial</text>
<rect x="40" y="760" width="1120" height="340" rx="14" fill="#1A2B33" stroke="#26373F"/>
<text x="70" y="804" font-size="22" fill="#E8E1D0" font-weight="700" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">3. Mongolian-lean</text>
<text x="70" y="828" font-size="14.5" fill="#9fb3ba" font-weight="400" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">Vertical spine, top to bottom, columns left to right. Ticks and loops hang off the spine.</text>
<text x="70" y="864" font-size="13.5" fill="#9fb3ba" font-weight="400" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">- Right ticks and loops are a, i. Left ones are e, o.</text>
<text x="70" y="890" font-size="13.5" fill="#9fb3ba" font-weight="400" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">- Strongest silhouette difference from the dwarves. It</text>
<text x="70" y="910" font-size="13.5" fill="#9fb3ba" font-weight="400" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">  stands out even from across a room.</text>
<text x="70" y="936" font-size="13.5" fill="#9fb3ba" font-weight="400" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">- Tall and narrow suits elves, but it is the hardest</text>
<text x="70" y="956" font-size="13.5" fill="#9fb3ba" font-weight="400" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">  of the three to carve.</text>
