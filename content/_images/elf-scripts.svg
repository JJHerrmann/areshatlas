<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1160" width="1200" height="1160">
<rect width="1200" height="1160" fill="#0d171c"/>
<rect x="40" y="40" width="1120" height="340" rx="14" fill="#1A2B33" stroke="#26373F"/>
<text x="70" y="84" font-size="22" fill="#E8E1D0" font-weight="700" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">1. Syriac-lean</text>
<text x="70" y="108" font-size="14.5" fill="#9fb3ba" font-weight="400" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">Joined baseline, thin monoline, long descending tails. Vowels are full letters.</text>
<text x="70" y="144" font-size="13.5" fill="#9fb3ba" font-weight="400" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">- Reads right to left. Dots mark e, i and n.</text>
<text x="70" y="170" font-size="13.5" fill="#9fb3ba" font-weight="400" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">- Tails drop below the line, which gives the hand its</text>
<text x="70" y="190" font-size="13.5" fill="#9fb3ba" font-weight="400" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">  drifting rhythm.</text>
<text x="70" y="216" font-size="13.5" fill="#9fb3ba" font-weight="400" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">- Closest to the dwarf hand in structure, so it reads</text>
<text x="70" y="236" font-size="13.5" fill="#9fb3ba" font-weight="400" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">  as a cousin script.</text>
<g transform="translate(1110,230) scale(1.45)">
